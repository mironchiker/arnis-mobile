      - name: Setup Complete Android Project Structure
        run: |
          # Создаем корректную структуру папок Android-проекта внутри android/
          mkdir -p android/app/src/main/java/com/arnis/app
          mkdir -p android/app/src/main/res

          # Создаем settings.gradle (упрощенный, совместимый с любым Gradle)
          cat << 'EOF' > android/settings.gradle
          rootProject.name = "ArnisMobile"
          include ':app'
          EOF

          # Создаем корневой build.gradle с репозиториями (подходит для Gradle 4.x - 8.x)
          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          # Создаем build.gradle для модуля app
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.arnis.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.arnis.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
          }
          EOF

          # Создаем базовый AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.arnis.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Arnis"
                  android:supportsRtl="true">
              </application>
          </manifest>
          EOF
