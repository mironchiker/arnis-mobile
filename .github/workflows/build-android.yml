name: Build Android APK (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust JNI library (.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cargo ndk \
            -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build --release --no-default-features
          echo "Built .so:"
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Create Kotlin sources
        run: |
          mkdir -p android/app/src/main/java/com/arnis/app

          cat > android/app/src/main/java/com/arnis/app/NativeBridge.kt << 'KT'
          package com.arnis.app

          object NativeBridge {
              init {
                  System.loadLibrary("arnis_mobile")
              }

              external fun generateWorldFromFile(
                  osmFile: String,
                  isBedrock: Boolean,
                  outputPath: String
              ): Boolean

              external fun cancelGeneration()
          }
          KT

          cat > android/app/src/main/java/com/arnis/app/MainActivity.kt << 'KT'
          package com.arnis.app

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import java.io.File
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {
              private val bg = Color.rgb(35, 35, 35)
              private val panel = Color.rgb(48, 48, 48)
              private val fieldBg = Color.rgb(27, 27, 27)
              private val yellow = Color.rgb(254, 204, 68)
              private val fgColor = Color.rgb(245, 245, 245)
              private val muted = Color.rgb(180, 180, 180)
              private val red = Color.rgb(255, 80, 80)
              private lateinit var generateButton: Button
              private lateinit var status: TextView
              private lateinit var javaButton: Button
              private lateinit var bedrockButton: Button
              private lateinit var fileNameText: TextView
              private var bedrock = false
              private var osmFilePath: String? = null

              companion object {
                  const val PICK_OSM_FILE = 1001
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  buildUi()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_OSM_FILE && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      copyOsmFile(uri)
                  }
              }

              private fun copyOsmFile(uri: Uri) {
                  try {
                      val fileName = getFileName(uri) ?: "map.osm"
                      val dest = File(filesDir, fileName)
                      contentResolver.openInputStream(uri)?.use { input ->
                          FileOutputStream(dest).use { output -> input.copyTo(output) }
                      }
                      osmFilePath = dest.absolutePath
                      fileNameText.text = "📄 $fileName"
                      fileNameText.setTextColor(yellow)
                      status.text = "Файл загружен. Нажми СОЗДАТЬ МИР."
                      status.setTextColor(muted)
                  } catch (e: Exception) {
                      status.text = "Ошибка загрузки файла: ${e.message}"
                      status.setTextColor(red)
                  }
              }

              private fun getFileName(uri: Uri): String? {
                  var name: String? = null
                  contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                      val idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (cursor.moveToFirst() && idx >= 0) name = cursor.getString(idx)
                  }
                  return name ?: uri.lastPathSegment
              }

              private fun buildUi() {
                  val scroll = ScrollView(this).apply { setBackgroundColor(bg) }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(18), dp(20), dp(24))
                      setBackgroundColor(bg)
                  }
                  scroll.addView(root)

                  // ── шапка ──────────────────────────────────────────────
                  val brand = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val logo = TextView(this).apply {
                      text = "A"; textSize = 30f; setTextColor(bg)
                      gravity = Gravity.CENTER; typeface = Typeface.DEFAULT_BOLD
                      background = shape(yellow, 14)
                  }
                  brand.addView(logo, LinearLayout.LayoutParams(dp(54), dp(54)))
                  val titleCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(dp(13), 0, 0, 0)
                  }
                  titleCol.addView(label("ARNIS", 25f, fgColor, true))
                  titleCol.addView(label("REAL WORLD → MINECRAFT", 10f, yellow, true))
                  brand.addView(titleCol)
                  root.addView(brand)
                  root.addView(space(22))

                  root.addView(label("Создай свой мир", 26f, fgColor, true))
                  root.addView(label(
                      "Скачай .osm файл с openstreetmap.org → Export и загрузи его сюда.",
                      14f, muted, false
                  ).apply { setPadding(0, dp(7), 0, 0) })
                  root.addView(space(20))

                  // ── шаг 1: инструкция ──────────────────────────────────
                  val step1 = card()
                  step1.addView(label("01  ·  КАК СКАЧАТЬ КАРТУ", 13f, yellow, true))
                  step1.addView(label(
                      "1. Открой openstreetmap.org\n2. Найди нужное место\n3. Нажми Export сверху\n4. Выбери область и нажми Export\n5. Скачается файл map.osm",
                      13f, fgColor, false
                  ).apply { setPadding(0, dp(9), 0, 0) })
                  root.addView(step1)
                  root.addView(space(14))

                  // ── шаг 2: выбор файла ─────────────────────────────────
                  val step2 = card()
                  step2.addView(label("02  ·  ФАЙЛ КАРТЫ (.osm)", 13f, yellow, true))
                  fileNameText = label("Файл не выбран", 14f, muted, false).apply {
                      setPadding(0, dp(8), 0, dp(10))
                  }
                  step2.addView(fileNameText)
                  val pickBtn = Button(this).apply {
                      text = "Выбрать .osm файл"
                      textSize = 14f; isAllCaps = false; typeface = Typeface.DEFAULT_BOLD
                      setTextColor(fgColor); background = shape(fieldBg, 10)
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                          }
                          startActivityForResult(intent, PICK_OSM_FILE)
                      }
                  }
                  step2.addView(pickBtn, LinearLayout.LayoutParams(-1, dp(46)))
                  root.addView(step2)
                  root.addView(space(14))

                  // ── шаг 3: формат ──────────────────────────────────────
                  val step3 = card()
                  step3.addView(label("03  ·  ВЕРСИЯ MINECRAFT", 13f, yellow, true))
                  step3.addView(label("Выбери формат мира", 16f, fgColor, true).apply {
                      setPadding(0, dp(8), 0, dp(10))
                  })
                  val formatRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  javaButton = smallButton("Java Edition") { setEdition(false) }
                  bedrockButton = smallButton("Bedrock") { setEdition(true) }
                  formatRow.addView(javaButton, LinearLayout.LayoutParams(0, dp(46), 1f))
                  formatRow.addView(spaceH(8))
                  formatRow.addView(bedrockButton, LinearLayout.LayoutParams(0, dp(46), 1f))
                  step3.addView(formatRow)
                  root.addView(step3)
                  root.addView(space(20))

                  // ── кнопка генерации ───────────────────────────────────
                  generateButton = Button(this).apply {
                      text = "СОЗДАТЬ МИР  →"
                      textSize = 15f; typeface = Typeface.DEFAULT_BOLD; isAllCaps = false
                      setTextColor(Color.rgb(25, 25, 25)); background = shape(yellow, 14)
                      setOnClickListener { startGeneration() }
                  }
                  root.addView(generateButton, LinearLayout.LayoutParams(-1, dp(56)))
                  root.addView(space(14))

                  // ── статус ─────────────────────────────────────────────
                  val statusCard = card()
                  statusCard.addView(label("СТАТУС", 11f, yellow, true))
                  status = label("Загрузи .osm файл и нажми СОЗДАТЬ МИР.", 13f, muted, false)
                  status.setPadding(0, dp(8), 0, 0)
                  statusCard.addView(status)
                  root.addView(statusCard)
                  root.addView(space(14))
                  root.addView(label(
                      "Arnis · OpenStreetMap → Minecraft", 11f, muted, false
                  ).apply { gravity = Gravity.CENTER })

                  setContentView(scroll)
                  setEdition(false)
              }

              private fun startGeneration() {
                  val path = osmFilePath
                  if (path == null) {
                      status.text = "Сначала выбери .osm файл!"
                      status.setTextColor(red)
                      return
                  }
                  generateButton.isEnabled = false
                  generateButton.text = "ГЕНЕРАЦИЯ…"
                  status.setTextColor(muted)
                  status.text = "Генерируем мир из файла. Это займёт несколько минут…"
                  Thread {
                      var success = false
                      var msg = ""
                      try {
                          val base = getExternalFilesDir(null) ?: filesDir
                          val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                          val out = File(base, "ArnisWorlds/Arnis_$stamp")
                          out.mkdirs()
                          success = NativeBridge.generateWorldFromFile(
                              path,
                              bedrock,
                              out.absolutePath
                          )
                          msg = if (success) "✓ Мир создан:\n${out.absolutePath}"
                          else "Генерация не завершилась. Попробуй меньшую область."
                      } catch (t: Throwable) {
                          msg = "Ошибка: ${t.javaClass.simpleName}: ${t.message ?: "?"}"
                      }
                      val finalMsg = msg; val ok = success
                      runOnUiThread {
                          generateButton.isEnabled = true
                          generateButton.text = "СОЗДАТЬ МИР  →"
                          status.text = finalMsg
                          status.setTextColor(if (ok) yellow else red)
                      }
                  }.start()
              }

              private fun setEdition(isBedrock: Boolean) {
                  bedrock = isBedrock
                  styleChoice(javaButton, !isBedrock)
                  styleChoice(bedrockButton, isBedrock)
              }

              private fun styleChoice(b: Button, selected: Boolean) {
                  b.background = shape(if (selected) yellow else Color.rgb(27, 27, 27), 10)
                  b.setTextColor(if (selected) Color.rgb(25, 25, 25) else fgColor)
              }

              private fun smallButton(caption: String, action: () -> Unit) = Button(this).apply {
                  text = caption; textSize = 12f; isAllCaps = false
                  setTextColor(fgColor); background = shape(Color.rgb(27, 27, 27), 10)
                  setPadding(dp(4), dp(4), dp(4), dp(4))
                  setOnClickListener { action() }
              }

              private fun card() = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(dp(15), dp(15), dp(15), dp(15))
                  background = shape(panel, 14)
                  layoutParams = LinearLayout.LayoutParams(
                      -1, ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { bottomMargin = dp(2) }
              }

              private fun label(value: String, size: Float, color: Int, bold: Boolean) =
                  TextView(this).apply {
                      text = value; textSize = size; setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }

              private fun shape(color: Int, radius: Int) = GradientDrawable().apply {
                  setColor(color); cornerRadius = dp(radius).toFloat()
              }

              private fun space(h: Int) = View(this).apply {
                  layoutParams = LinearLayout.LayoutParams(1, dp(h))
              }
              private fun spaceH(w: Int) = View(this).apply {
                  layoutParams = LinearLayout.LayoutParams(dp(w), 1)
              }
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          }
          KT

      - name: Generate Android project files
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/values

          cat > android/settings.gradle << 'GRADLE'
          rootProject.name = "ArnisMobile"
          include ':app'
          GRADLE

          cat > android/build.gradle << 'GRADLE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          GRADLE

          cat > android/app/build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.arnis.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.arnis.app"
                  minSdk 24
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main {
                      jniLibs.srcDirs = ['src/main/jniLibs']
                      java.srcDirs = ['src/main/java']
                  }
              }

              signingConfigs {
                  release {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              packagingOptions {
                  doNotStrip "**/*.so"
              }
          }

          dependencies {}
          GRADLE

          cat > android/app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <application
                  android:allowBackup="true"
                  android:label="Arnis"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > android/app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Arnis</string>
          </resources>
          XML

      - name: Generate debug keystore
        run: |
          keytool \
            -genkey -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle --version
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arnis-mobile-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Arnis Mobile v1.0.${{ github.run_number }}"
          body: |
            Android APK — автосборка из Actions.
            Минимальная версия Android: 7.0 (API 24)
            Архитектура: arm64-v8a
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
