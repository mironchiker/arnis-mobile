name: Build Android APK (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ────────────────────────────────────────────────────────
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Android NDK r26b ───────────────────────────────────────────────
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      # ── 4. Rust stable + aarch64 target ───────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ── 5. кэшируем cargo ─────────────────────────────────────────────────
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      # ── 6. cargo-ndk ──────────────────────────────────────────────────────
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ── 7. собираем libarnis_mobile.so ────────────────────────────────────
      - name: Build Rust JNI library (.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cargo ndk \
            -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build --release --no-default-features
          echo "Built .so:"
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      # ── 8. создаём Kotlin исходники ───────────────────────────────────────
      - name: Create Kotlin sources
        run: |
          mkdir -p android/app/src/main/java/com/arnis/app

          cat > android/app/src/main/java/com/arnis/app/NativeBridge.kt << 'KT'
          package com.arnis.app

          object NativeBridge {
              init {
                  System.loadLibrary("arnis_mobile")
              }

              external fun generateWorld(
                  minLat: Double,
                  minLon: Double,
                  maxLat: Double,
                  maxLon: Double,
                  isBedrock: Boolean,
                  version: String,
                  outputPath: String
              ): Boolean

              external fun cancelGeneration()
          }
          KT

          cat > android/app/src/main/java/com/arnis/app/MainActivity.kt << 'KT'
          package com.arnis.app

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import android.text.InputType
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {
              private val bg = Color.rgb(35, 35, 35)
              private val panel = Color.rgb(48, 48, 48)
              private val fieldBg = Color.rgb(27, 27, 27)
              private val yellow = Color.rgb(254, 204, 68)
              private val fgColor = Color.rgb(245, 245, 245)
              private val muted = Color.rgb(180, 180, 180)
              private lateinit var minLat: EditText
              private lateinit var minLon: EditText
              private lateinit var maxLat: EditText
              private lateinit var maxLon: EditText
              private lateinit var generateButton: Button
              private lateinit var status: TextView
              private lateinit var javaButton: Button
              private lateinit var bedrockButton: Button
              private var bedrock = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  window.decorView.systemUiVisibility = 0
                  buildUi()
              }

              private fun buildUi() {
                  val scroll = ScrollView(this).apply { setBackgroundColor(bg); clipToPadding = false }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(18), dp(20), dp(24))
                      setBackgroundColor(bg)
                  }
                  scroll.addView(root)

                  val brand = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  val logo = TextView(this).apply {
                      text = "A"; textSize = 30f; setTextColor(bg)
                      gravity = Gravity.CENTER; typeface = Typeface.DEFAULT_BOLD; background = shape(yellow, 14)
                  }
                  brand.addView(logo, LinearLayout.LayoutParams(dp(54), dp(54)))
                  val titleColumn = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(13), 0, 0, 0) }
                  titleColumn.addView(label("ARNIS", 25f, fgColor, true))
                  titleColumn.addView(label("REAL WORLD → MINECRAFT", 10f, yellow, true))
                  brand.addView(titleColumn)
                  root.addView(brand)
                  root.addView(space(22))

                  root.addView(label("Создай свой мир", 26f, fgColor, true))
                  root.addView(label("Выбери область на карте координатами и сгенерируй её в Minecraft.", 14f, muted, false).apply { setPadding(0, dp(7), 0, 0) })
                  root.addView(space(20))

                  val locationCard = card()
                  locationCard.addView(label("01  ·  ОБЛАСТЬ", 13f, yellow, true))
                  locationCard.addView(label("Географические координаты", 16f, fgColor, true).apply { setPadding(0, dp(9), 0, dp(4)) })
                  locationCard.addView(label("Укажи юго-западный и северо-восточный углы.", 12f, muted, false))
                  root.addView(locationCard)

                  val presets = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; setPadding(0, dp(12), 0, dp(2)) }
                  presets.addView(smallButton("Вроцлав") { setCoords(51.105, 17.025, 51.112, 17.035) }, weightedParams())
                  presets.addView(spaceHorizontal(8))
                  presets.addView(smallButton("Берлин") { setCoords(52.515, 13.395, 52.522, 13.405) }, weightedParams())
                  presets.addView(spaceHorizontal(8))
                  presets.addView(smallButton("NYC") { setCoords(40.711, -74.012, 40.718, -74.002) }, weightedParams())
                  root.addView(presets)

                  val coords = card()
                  coords.addView(label("Минимальная широта / долгота", 12f, muted, true))
                  val row1 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  minLat = coordinateInput("51.105000")
                  minLon = coordinateInput("17.025000")
                  row1.addView(minLat, weightedParams())
                  row1.addView(spaceHorizontal(10))
                  row1.addView(minLon, weightedParams())
                  coords.addView(row1)
                  coords.addView(label("Максимальная широта / долгота", 12f, muted, true).apply { setPadding(0, dp(12), 0, 0) })
                  val row2 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  maxLat = coordinateInput("51.112000")
                  maxLon = coordinateInput("17.035000")
                  row2.addView(maxLat, weightedParams())
                  row2.addView(spaceHorizontal(10))
                  row2.addView(maxLon, weightedParams())
                  coords.addView(row2)
                  root.addView(coords)
                  root.addView(space(18))

                  val formatCard = card()
                  formatCard.addView(label("02  ·  ВЕРСИЯ MINECRAFT", 13f, yellow, true))
                  formatCard.addView(label("Выбери формат мира", 16f, fgColor, true).apply { setPadding(0, dp(8), 0, dp(10)) })
                  val formatRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  javaButton = smallButton("Java Edition") { setEdition(false) }
                  bedrockButton = smallButton("Bedrock") { setEdition(true) }
                  formatRow.addView(javaButton, weightedParams())
                  formatRow.addView(spaceHorizontal(10))
                  formatRow.addView(bedrockButton, weightedParams())
                  formatCard.addView(formatRow)
                  root.addView(formatCard)
                  root.addView(space(20))

                  generateButton = Button(this).apply {
                      text = "СОЗДАТЬ МИР  →"; textSize = 15f; typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.rgb(25, 25, 25)); background = shape(yellow, 14)
                      isAllCaps = false; setPadding(dp(12), dp(8), dp(12), dp(8))
                      setOnClickListener { startGeneration() }
                  }
                  root.addView(generateButton, LinearLayout.LayoutParams(-1, dp(56)))
                  root.addView(space(14))

                  val statusCard = card()
                  statusCard.addView(label("СТАТУС", 11f, yellow, true))
                  status = label("Готово к генерации. Для загрузки данных нужен интернет.", 13f, muted, false)
                  status.setPadding(0, dp(8), 0, 0)
                  statusCard.addView(status)
                  root.addView(statusCard)
                  root.addView(space(14))
                  root.addView(label("Arnis · OpenStreetMap → Minecraft", 11f, muted, false).apply { gravity = Gravity.CENTER })
                  setContentView(scroll)
                  setEdition(false)
              }

              private fun startGeneration() {
                  val a = minLat.text.toString().toDoubleOrNull()
                  val b = minLon.text.toString().toDoubleOrNull()
                  val c = maxLat.text.toString().toDoubleOrNull()
                  val d = maxLon.text.toString().toDoubleOrNull()
                  if (a == null || b == null || c == null || d == null ||
                      a !in -90.0..90.0 || c !in -90.0..90.0 ||
                      b !in -180.0..180.0 || d !in -180.0..180.0 || a >= c || b >= d) {
                      status.text = "Проверь координаты: значения должны быть числами, а минимум меньше максимума."
                      status.setTextColor(Color.rgb(255, 130, 120))
                      return
                  }
                  generateButton.isEnabled = false
                  generateButton.text = "ГЕНЕРАЦИЯ…"
                  status.setTextColor(muted)
                  status.text = "Загружаем данные OpenStreetMap и создаём мир. Это может занять несколько минут."
                  Thread {
                      var success = false
                      var errorText: String? = null
                      try {
                          val base = getExternalFilesDir(null) ?: filesDir
                          val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                          val out = File(base, "ArnisWorlds/Arnis_$stamp")
                          out.mkdirs()
                          success = NativeBridge.generateWorld(a, b, c, d, bedrock, if (bedrock) "1.21.0.3" else "1.21.4", out.absolutePath)
                          errorText = if (success) "Мир создан: ${out.absolutePath}"
                          else "Генерация не завершилась. Проверь интернет и попробуй уменьшить область."
                      } catch (t: Throwable) {
                          errorText = "Ошибка: ${t.javaClass.simpleName}: ${t.message ?: "неизвестная ошибка"}"
                      }
                      runOnUiThread {
                          generateButton.isEnabled = true
                          generateButton.text = "СОЗДАТЬ МИР  →"
                          status.text = errorText ?: "Готово."
                          status.setTextColor(if (success) yellow else Color.rgb(255, 130, 120))
                      }
                  }.start()
              }

              private fun setCoords(a: Double, b: Double, c: Double, d: Double) {
                  minLat.setText("%.6f".format(Locale.US, a)); minLon.setText("%.6f".format(Locale.US, b))
                  maxLat.setText("%.6f".format(Locale.US, c)); maxLon.setText("%.6f".format(Locale.US, d))
              }

              private fun setEdition(isBedrock: Boolean) {
                  bedrock = isBedrock
                  styleChoice(javaButton, !isBedrock)
                  styleChoice(bedrockButton, isBedrock)
              }

              private fun styleChoice(b: Button, selected: Boolean) {
                  b.background = shape(if (selected) yellow else fieldBg, 10)
                  b.setTextColor(if (selected) Color.rgb(25, 25, 25) else fgColor)
              }

              private fun coordinateInput(value: String) = EditText(this).apply {
                  setSingleLine(true); setText(value); textSize = 14f
                  setTextColor(fgColor); setHintTextColor(muted)
                  inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL or InputType.TYPE_NUMBER_FLAG_SIGNED
                  setPadding(dp(12), dp(8), dp(12), dp(8)); background = shape(fieldBg, 9)
              }

              private fun smallButton(caption: String, action: () -> Unit) = Button(this).apply {
                  text = caption; textSize = 12f; isAllCaps = false
                  setTextColor(fgColor); background = shape(fieldBg, 10)
                  setPadding(dp(4), dp(4), dp(4), dp(4)); setOnClickListener { action() }
              }

              private fun card() = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(dp(15), dp(15), dp(15), dp(15)); background = shape(panel, 14)
                  layoutParams = LinearLayout.LayoutParams(-1, ViewGroup.LayoutParams.WRAP_CONTENT).apply { bottomMargin = dp(2) }
              }

              private fun label(value: String, size: Float, color: Int, bold: Boolean) = TextView(this).apply {
                  text = value; textSize = size; setTextColor(color)
                  if (bold) typeface = Typeface.DEFAULT_BOLD
              }

              private fun shape(color: Int, radius: Int) = GradientDrawable().apply {
                  setColor(color); cornerRadius = dp(radius).toFloat()
              }

              private fun space(h: Int) = View(this).apply { layoutParams = LinearLayout.LayoutParams(1, dp(h)) }
              private fun spaceHorizontal(w: Int) = View(this).apply { layoutParams = LinearLayout.LayoutParams(dp(w), 1) }
              private fun weightedParams() = LinearLayout.LayoutParams(0, dp(46), 1f)
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          }
          KT

      # ── 9. Android project structure ──────────────────────────────────────
      - name: Generate Android project files
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/values

          cat > android/settings.gradle << 'GRADLE'
          rootProject.name = "ArnisMobile"
          include ':app'
          GRADLE

          cat > android/build.gradle << 'GRADLE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          GRADLE

          cat > android/app/build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.arnis.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.arnis.app"
                  minSdk 24
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"
              }

              sourceSets {
                  main {
                      jniLibs.srcDirs = ['src/main/jniLibs']
                      java.srcDirs = ['src/main/java']
                  }
              }

              signingConfigs {
                  release {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              packagingOptions {
                  doNotStrip "**/*.so"
              }
          }

          dependencies {}
          GRADLE

          cat > android/app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="29" />
              <application
                  android:allowBackup="true"
                  android:label="Arnis"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > android/app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Arnis</string>
          </resources>
          XML

      # ── 10. keystore ──────────────────────────────────────────────────────
      - name: Generate debug keystore
        run: |
          keytool \
            -genkey -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ── 11. Gradle 8.5 + assembleRelease ──────────────────────────────────
      - name: Build APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle --version
          gradle assembleRelease --no-daemon --stacktrace

      # ── 12. verify ────────────────────────────────────────────────────────
      - name: Verify APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "no apks found"
            exit 1
          fi
          ls -lh "$APK_PATH"

      # ── 13. inspect JNI ───────────────────────────────────────────────────
      - name: Inspect APK contents and JNI exports
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          echo "=== Native libs in APK ==="
          unzip -Z1 "$APK_PATH" | grep -E '\.so$' || true
          TMP_SO="$(mktemp --suffix=.so)"
          unzip -p "$APK_PATH" lib/arm64-v8a/libarnis_mobile.so > "$TMP_SO"
          echo "=== JNI symbols ==="
          strings "$TMP_SO" | grep "Java_com_arnis" || echo "WARNING: no JNI symbols found"
          rm -f "$TMP_SO"

      # ── 14. upload artifact ───────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arnis-mobile-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── 15. GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Arnis Mobile v1.0.${{ github.run_number }}"
          body: |
            Android APK — автосборка из Actions.

            **Установка:** скачай APK, разреши установку из неизвестных источников, установи.
            **Минимальная версия Android:** 7.0 (API 24)
            **Архитектура:** arm64-v8a
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
