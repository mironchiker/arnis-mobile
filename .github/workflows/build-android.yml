name: Build Android APK (Manual)

on:
  workflow_dispatch: # Запуск только вручную по кнопке в Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust JNI Library (.so)
        run: |
          mkdir -p ./android/app/src/main/jniLibs/arm64-v8a
          cargo ndk -t arm64-v8a -o ./android/app/src/main/jniLibs build --release --no-default-features

      - name: Setup Complete Android Project Structure
        run: |
          mkdir -p android/app/src/main/java/com/arnis/app
          mkdir -p android/app/src/main/res

          cat << 'EOF' > android/settings.gradle
          rootProject.name = "ArnisMobile"
          include ':app'
          EOF

          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.arnis.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.arnis.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.arnis.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Arnis"
                  android:supportsRtl="true">
              </application>
          </manifest>
          EOF

      - name: Setup & Run Gradle 8.5 Manually
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle --version
          gradle assembleRelease --no-daemon || gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arnis-mobile-apk
          path: android/app/build/outputs/apk/**/*.apk
