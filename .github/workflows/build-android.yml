name: Build Android APK (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust JNI library (.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cargo ndk \
            -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build --release --no-default-features
          echo "Built .so:"
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Create Kotlin sources
        run: |
          mkdir -p android/app/src/main/java/com/arnis/app

          cat > android/app/src/main/java/com/arnis/app/NativeBridge.kt << 'KT'
          package com.arnis.app

          object NativeBridge {
              init {
                  System.loadLibrary("arnis_mobile")
              }

              external fun generateWorldFromFile(
                  osmFile: String,
                  isBedrock: Boolean,
                  outputPath: String
              ): Boolean

              external fun cancelGeneration()
          }
          KT

          cat > android/app/src/main/java/com/arnis/app/MainActivity.kt << 'KT'
          package com.arnis.app

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.provider.OpenableColumns
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.*
          import android.widget.*
          import java.io.File
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {
              private val bg = Color.rgb(35, 35, 35)
              private val panel = Color.rgb(48, 48, 48)
              private val fieldBg = Color.rgb(27, 27, 27)
              private val yellow = Color.rgb(254, 204, 68)
              private val fgColor = Color.rgb(245, 245, 245)
              private val muted = Color.rgb(180, 180, 180)
              private val red = Color.rgb(255, 80, 80)
              private lateinit var generateButton: Button
              private lateinit var status: TextView
              private lateinit var javaButton: Button
              private lateinit var bedrockButton: Button
              private lateinit var fileNameText: TextView
              private lateinit var tabFile: Button
              private lateinit var tabMap: Button
              private lateinit var filePanelView: LinearLayout
              private lateinit var mapPanelView: LinearLayout
              private lateinit var webView: WebView
              private lateinit var clearButton: Button
              private var bedrock = false
              private var osmFilePath: String? = null
              private var useMap = false
              private var minLat = 0.0; private var minLon = 0.0
              private var maxLat = 0.0; private var maxLon = 0.0
              private var hasSelection = false

              companion object {
                  const val PICK_OSM_FILE = 1001
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  buildUi()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_OSM_FILE && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      copyOsmFile(uri)
                  }
              }

              private fun getOutputDir(): File {
                  val downloads = Environment.getExternalStoragePublicDirectory(
                      Environment.DIRECTORY_DOWNLOADS
                  )
                  val dir = File(downloads, "ArnisWorlds")
                  dir.mkdirs()
                  return dir
              }

              private fun copyOsmFile(uri: Uri) {
                  try {
                      val fileName = getFileName(uri) ?: "map.osm"
                      val dest = File(filesDir, fileName)
                      contentResolver.openInputStream(uri)?.use { input ->
                          FileOutputStream(dest).use { output -> input.copyTo(output) }
                      }
                      osmFilePath = dest.absolutePath
                      fileNameText.text = "📄 $fileName"
                      fileNameText.setTextColor(yellow)
                      status.text = "Файл загружен. Нажми СОЗДАТЬ МИР."
                      status.setTextColor(muted)
                  } catch (e: Exception) {
                      status.text = "Ошибка загрузки файла: ${e.message}"
                      status.setTextColor(red)
                  }
              }

              private fun getFileName(uri: Uri): String? {
                  var name: String? = null
                  contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                      val idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (cursor.moveToFirst() && idx >= 0) name = cursor.getString(idx)
                  }
                  return name ?: uri.lastPathSegment
              }

              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bg)
                  }

                  // ── шапка ──────────────────────────────────────────────
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(12), dp(16), dp(8))
                      setBackgroundColor(bg)
                  }
                  val logo = TextView(this).apply {
                      text = "A"; textSize = 22f; setTextColor(bg)
                      gravity = Gravity.CENTER; typeface = Typeface.DEFAULT_BOLD
                      background = shape(yellow, 10)
                  }
                  header.addView(logo, LinearLayout.LayoutParams(dp(40), dp(40)))
                  val titles = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(dp(10), 0, 0, 0)
                  }
                  titles.addView(label("ARNIS", 16f, fgColor, true))
                  titles.addView(label("Real World → Minecraft", 10f, yellow, true))
                  header.addView(titles, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(header)

                  // ── табы источника ─────────────────────────────────────
                  val tabRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(16), dp(4), dp(16), dp(8))
                  }
                  tabFile = Button(this).apply {
                      text = "📄 Файл .osm"; textSize = 13f; isAllCaps = false
                      setOnClickListener { switchTab(false) }
                  }
                  tabMap = Button(this).apply {
                      text = "🗺 Карта"; textSize = 13f; isAllCaps = false
                      setOnClickListener { switchTab(true) }
                  }
                  tabRow.addView(tabFile, LinearLayout.LayoutParams(0, dp(40), 1f))
                  tabRow.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(dp(8), 1) })
                  tabRow.addView(tabMap, LinearLayout.LayoutParams(0, dp(40), 1f))
                  root.addView(tabRow)

                  // ── панель файла ───────────────────────────────────────
                  filePanelView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(4), dp(16), dp(8))
                  }
                  val step1 = card()
                  step1.addView(label("КАК СКАЧАТЬ КАРТУ", 12f, yellow, true))
                  step1.addView(label(
                      "1. Открой openstreetmap.org\n2. Найди место\n3. Нажми Экспорт сверху\n4. Выбери область → Экспорт\n5. Скачается map.osm",
                      13f, fgColor, false
                  ).apply { setPadding(0, dp(6), 0, 0) })
                  filePanelView.addView(step1)
                  filePanelView.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(1, dp(10)) })

                  val step2 = card()
                  step2.addView(label("ФАЙЛ КАРТЫ (.osm / .osm.xml)", 12f, yellow, true))
                  fileNameText = label("Файл не выбран", 14f, muted, false).apply {
                      setPadding(0, dp(6), 0, dp(8))
                  }
                  step2.addView(fileNameText)
                  val pickBtn = Button(this).apply {
                      text = "Выбрать файл"
                      textSize = 14f; isAllCaps = false; typeface = Typeface.DEFAULT_BOLD
                      setTextColor(fgColor); background = shape(fieldBg, 10)
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                          }
                          startActivityForResult(intent, PICK_OSM_FILE)
                      }
                  }
                  step2.addView(pickBtn, LinearLayout.LayoutParams(-1, dp(46)))
                  filePanelView.addView(step2)
                  root.addView(filePanelView)

                  // ── панель карты ───────────────────────────────────────
                  mapPanelView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                  }
                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.builtInZoomControls = true
                      settings.displayZoomControls = false
                      addJavascriptInterface(MapBridge(), "Android")
                      webViewClient = WebViewClient()
                  }
                  mapPanelView.addView(webView, LinearLayout.LayoutParams(-1, 0, 1f))
                  clearButton = Button(this).apply {
                      text = "Очистить территорию"
                      textSize = 13f; isAllCaps = false; typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE); background = shape(red, 0)
                      visibility = View.GONE
                      setOnClickListener { clearSelection() }
                  }
                  mapPanelView.addView(clearButton, LinearLayout.LayoutParams(-1, dp(46)))
                  root.addView(mapPanelView, LinearLayout.LayoutParams(-1, 0, 1f))

                  // ── выбор формата ──────────────────────────────────────
                  val formatRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(16), dp(6), dp(16), dp(6))
                  }
                  javaButton = toggleBtn("Java Edition") { setEdition(false) }
                  bedrockButton = toggleBtn("Bedrock") { setEdition(true) }
                  formatRow.addView(javaButton, LinearLayout.LayoutParams(0, dp(38), 1f))
                  formatRow.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(dp(8), 1) })
                  formatRow.addView(bedrockButton, LinearLayout.LayoutParams(0, dp(38), 1f))
                  root.addView(formatRow)

                  // ── кнопка генерации ───────────────────────────────────
                  generateButton = Button(this).apply {
                      text = "СОЗДАТЬ МИР  →"
                      textSize = 15f; typeface = Typeface.DEFAULT_BOLD; isAllCaps = false
                      setTextColor(Color.rgb(25, 25, 25)); background = shape(yellow, 0)
                      setOnClickListener { startGeneration() }
                  }
                  root.addView(generateButton, LinearLayout.LayoutParams(-1, dp(56)))

                  // ── статус ─────────────────────────────────────────────
                  val statusCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(10))
                      setBackgroundColor(panel)
                  }
                  status = label("Выбери источник данных и нажми СОЗДАТЬ МИР.", 13f, muted, false)
                  statusCard.addView(status)
                  root.addView(statusCard)

                  setContentView(root)
                  setEdition(false)
                  switchTab(false)
                  webView.loadDataWithBaseURL("https://unpkg.com", mapHtml(), "text/html", "UTF-8", null)
              }

              private fun switchTab(map: Boolean) {
                  useMap = map
                  filePanelView.visibility = if (map) View.GONE else View.VISIBLE
                  mapPanelView.visibility = if (map) View.VISIBLE else View.GONE
                  styleToggle(tabFile, !map)
                  styleToggle(tabMap, map)
              }

              private fun clearSelection() {
                  hasSelection = false
                  clearButton.visibility = View.GONE
                  status.text = "Тапни две точки на карте чтобы выделить область"
                  status.setTextColor(muted)
                  webView.evaluateJavascript("clearSelection();", null)
              }

              private fun startGeneration() {
                  val outDir = getOutputDir()
                  val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  val out = File(outDir, "Arnis_$stamp")
                  out.mkdirs()

                  if (useMap) {
                      if (!hasSelection) {
                          status.text = "Сначала выдели область на карте!"
                          status.setTextColor(red)
                          return
                      }
                      // для карты нужен временный osm файл — качаем через Overpass
                      status.text = "Карта: функция в разработке, используй файл 😭"
                      status.setTextColor(red)
                      return
                  }

                  val path = osmFilePath
                  if (path == null) {
                      status.text = "Сначала выбери .osm файл!"
                      status.setTextColor(red)
                      return
                  }

                  generateButton.isEnabled = false
                  generateButton.text = "ГЕНЕРАЦИЯ…"
                  status.setTextColor(muted)
                  status.text = "Генерируем мир… Мир будет в Загрузки/ArnisWorlds/"

                  Thread {
                      var success = false
                      var msg = ""
                      try {
                          success = NativeBridge.generateWorldFromFile(
                              path, bedrock, out.absolutePath
                          )
                          msg = if (success) "✓ Мир создан!\nЗагрузки/ArnisWorlds/${out.name}"
                          else "Генерация не завершилась. Попробуй меньшую область."
                      } catch (t: Throwable) {
                          msg = "Ошибка: ${t.javaClass.simpleName}: ${t.message ?: "?"}"
                      }
                      val finalMsg = msg; val ok = success
                      runOnUiThread {
                          generateButton.isEnabled = true
                          generateButton.text = "СОЗДАТЬ МИР  →"
                          status.text = finalMsg
                          status.setTextColor(if (ok) yellow else red)
                      }
                  }.start()
              }

              private fun setEdition(isBedrock: Boolean) {
                  bedrock = isBedrock
                  styleToggle(javaButton, !isBedrock)
                  styleToggle(bedrockButton, isBedrock)
              }

              private fun styleToggle(b: Button, selected: Boolean) {
                  b.background = shape(if (selected) yellow else fieldBg, 10)
                  b.setTextColor(if (selected) Color.rgb(25, 25, 25) else fgColor)
              }

              inner class MapBridge {
                  @JavascriptInterface
                  fun onBboxSelected(lat1: Double, lon1: Double, lat2: Double, lon2: Double) {
                      minLat = minOf(lat1, lat2); maxLat = maxOf(lat1, lat2)
                      minLon = minOf(lon1, lon2); maxLon = maxOf(lon1, lon2)
                      hasSelection = true
                      runOnUiThread {
                          clearButton.visibility = View.VISIBLE
                          status.text = "Область: %.4f,%.4f → %.4f,%.4f".format(minLat, minLon, maxLat, maxLon)
                          status.setTextColor(yellow)
                      }
                  }
              }

              private fun mapHtml() = """
          <!DOCTYPE html>
          <html>
          <head>
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
          <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
          <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
          <style>
          * { margin:0; padding:0; box-sizing:border-box; }
          html,body,#map { width:100%; height:100%; background:#232323; }
          #searchbox {
              position:absolute; top:10px; left:50%; transform:translateX(-50%);
              z-index:1000; display:flex; gap:6px; width:90%;
          }
          #searchbox input {
              flex:1; padding:8px 12px; border-radius:8px; border:none;
              background:#1b1b1b; color:#f5f5f5; font-size:14px; outline:none;
          }
          #searchbox button {
              padding:8px 14px; border-radius:8px; border:none;
              background:#fecc44; color:#191919; font-weight:bold; font-size:13px;
          }
          #hint {
              position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
              z-index:1000; background:rgba(35,35,35,0.85); color:#b4b4b4;
              padding:6px 14px; border-radius:20px; font-size:12px; pointer-events:none;
          }
          </style>
          </head>
          <body>
          <div id="searchbox">
              <input id="q" type="text" placeholder="Поиск места…"/>
              <button onclick="search()">Найти</button>
          </div>
          <div id="map"></div>
          <div id="hint">Тапни 1-ю точку</div>
          <script>
          var map=L.map('map').setView([51.505,-0.09],13);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(map);
          var pt1=null,pt2=null,rect=null;
          var hint=document.getElementById('hint');
          function clearSelection(){
              pt1=null;pt2=null;
              if(rect){map.removeLayer(rect);rect=null;}
              hint.textContent='Тапни 1-ю точку';
          }
          map.on('click',function(e){
              if(!pt1){
                  pt1=e.latlng;
                  hint.textContent='Тапни 2-ю точку';
              } else {
                  pt2=e.latlng;
                  if(rect)map.removeLayer(rect);
                  var bounds=L.latLngBounds(pt1,pt2);
                  rect=L.rectangle(bounds,{color:'#fecc44',weight:2,fillColor:'#fecc44',fillOpacity:0.18}).addTo(map);
                  hint.textContent='Область выделена ✓';
                  Android.onBboxSelected(pt1.lat,pt1.lng,pt2.lat,pt2.lng);
                  pt1=null;pt2=null;
              }
          });
          function search(){
              var q=document.getElementById('q').value.trim();
              if(!q)return;
              fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q))
                  .then(r=>r.json())
                  .then(data=>{
                      if(data.length>0)map.setView([parseFloat(data[0].lat),parseFloat(data[0].lon)],15);
                      else hint.textContent='Место не найдено';
                  });
          }
          document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')search();});
          </script>
          </body>
          </html>
              """.trimIndent()

              private fun toggleBtn(caption: String, action: () -> Unit) = Button(this).apply {
                  text = caption; textSize = 13f; isAllCaps = false
                  setTextColor(fgColor); background = shape(fieldBg, 10)
                  setOnClickListener { action() }
              }

              private fun card() = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(dp(14), dp(14), dp(14), dp(14))
                  background = shape(panel, 12)
                  layoutParams = LinearLayout.LayoutParams(-1, ViewGroup.LayoutParams.WRAP_CONTENT)
              }

              private fun label(value: String, size: Float, color: Int, bold: Boolean) =
                  TextView(this).apply {
                      text = value; textSize = size; setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }

              private fun shape(color: Int, radius: Int) = GradientDrawable().apply {
                  setColor(color); cornerRadius = dp(radius).toFloat()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          }
          KT

      - name: Generate Android project files
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/values

          cat > android/settings.gradle << 'GRADLE'
          rootProject.name = "ArnisMobile"
          include ':app'
          GRADLE

          cat > android/build.gradle << 'GRADLE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          GRADLE

          cat > android/app/build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.arnis.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.arnis.app"
                  minSdk 24
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main {
                      jniLibs.srcDirs = ['src/main/jniLibs']
                      java.srcDirs = ['src/main/java']
                  }
              }

              signingConfigs {
                  release {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              packagingOptions {
                  doNotStrip "**/*.so"
              }
          }

          dependencies {}
          GRADLE

          cat > android/app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <application
                  android:allowBackup="true"
                  android:label="Arnis"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > android/app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Arnis</string>
          </resources>
          XML

      - name: Generate debug keystore
        run: |
          keytool \
            -genkey -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle --version
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arnis-mobile-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Arnis Mobile v1.0.${{ github.run_number }}"
          body: |
            Android APK — автосборка из Actions.
