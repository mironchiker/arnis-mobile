name: Build Android APK (Manual)

on:
  workflow_dispatch: # Запуск только вручную по кнопке в Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust JNI Library (.so)
        run: |
          cargo ndk -t arm64-v8a -o ./android/app/src/main/jniLibs build --release --no-default-features

      - name: Install Gradle & Upgrade Wrapper for Java 17
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arnis-mobile-apk
          path: android/app/build/outputs/apk/**/*.apk
